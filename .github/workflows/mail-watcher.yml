name: Mail watcher

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (GitHub may delay scheduled runs a little)
  workflow_dispatch: {}          # "Run workflow" button for an immediate check

permissions:
  contents: write

concurrency:
  group: mail-watcher
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python watcher/fetch_mail.py
      - name: Commit anything saved
        run: |
          git config user.name "mail-watcher"
          git config user.email "mail-watcher@users.noreply.github.com"
          git add inbox
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Mail watcher: $(ls inbox/pending 2>/dev/null | wc -l) pending"
          git push
